# The README claims the tests are checkable by anyone; this makes the claim run on every push.
# Dependencies mirror what the tests actually need: Pillow for the re-encode route, node (on the
# runner already) for holding the page to the Python redaction, tesseract nothing — OCR is mocked.
name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 -m unittest discover tests -v
